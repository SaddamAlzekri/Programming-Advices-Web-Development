<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparency</title>
    <style>
        .Transparency {
            width: 100%;
            height: 100vh;
            background-image: url(Example/Images/A2.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            color: white;
        }

        .cards {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 100px;
            border: none;
            border-radius: 5px;
        }
        .opacity {
            background-color: green;
            opacity: 0.5;
        }
        .rgba {
            background-color: rgba(245, 6, 173, 0.5);
        }

        .hsla {
            background-color: hsla(261, 71%, 75%, 0.5);
        }
        .color {
            background-color: black;
        }

        
    </style>
</head>
<body>
    <section class="Transparency">
        <h1 style="text-align: center;">CSS opacity / Transparency Demo</h1>
        
        <div class="cards">
            <div class="card opacity">opacity</div>
            <div class="card rgba">rgba</div>
            <div class="card hsla">hsla</div>
            <div class="card color">color: black;</div>
        </div>


    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Effects</title>
    <style>
        body {
            font-size: 18px;
            font-weight: bold;
            background-color: rgb(247, 244, 244);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .cards {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .card {
            width: 300px;
            height: 150px;
            border: none;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;      
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .soft{
            box-shadow: 2px 2px 10px rgb(0, 0, 0, 0.3);
        }

        .soft:hover {
            box-shadow: 5px 5px 20px rgb(0, 0, 0, 0.6);
            transform: translatey(-5px);
        }

        .spread {
            box-shadow: 3px 3px 8px 5px rgba(0, 0, 0, 0.5);
        }

        .spread:hover {
            box-shadow: 3px 3px 13px 10px rgba(0, 0, 0, 0.5);
            transform: translateY(-5px);
        }
        .inset {
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        .inset:hover {
            box-shadow: inset 0 0 30px rgba(0,0,0,0.4);
        }
        .text-shadow {
            text-shadow: 1px 1px 10px rgb(0, 0, 0);
            text-align: center;
        }
        .image {

            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        img {
            width: 300px;
            height: 200px;
            border-radius: 5px;
            box-shadow: 3px 3px 30px 5px green;
        }
        .btnSearch {
            margin: auto;
            width: 150px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            background-color: aqua;
            border: none;
            border-radius: 5px;
            box-shadow: 0 0 10px 5px rgba(218, 6, 6, 0.5);
        }
    </style>
</head>
<body>
    <h1>CSS Shadow Effects</h1>

    <section class="cards">
        <div class="card soft">soft shadow</div>
        <div class="card spread">spread shadow</div>
        <div class="card inset">insert shadow</div>
    </section>

    <section class="texts">
        <h2 style="text-align: center;">Text Shadow Example</h2>
        <p class="text-shadow">Shadows can make text pop!</p>
        <button class="btnSearch">Search</button>
    </section>

    <h2 style="text-align: center;">Drop-Shadow Filter on Image</h2>

    <section class="image">
        <img src="Example/Images/A2.jpg" alt="boxer shadow">
    </section>
</body>
</html>

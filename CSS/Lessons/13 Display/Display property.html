<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        h1 {
            text-align: center;
        }

        #block {
            margin: 5px;
            padding: 10px;
            display: block;
            background-color: aqua;
            border-radius: 10px;
        }

        #inline {
            margin: 5px;
            padding: 10px;
            display: inline;
            background-color: rgb(238, 155, 203);
            border-radius: 10px;
        }

        #inline-block {
            margin: 5px;
            padding: 10px;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            text-align: center;
            display: inline-block;
            background-color: rgb(238, 155, 203);
        }
        
    </style>
</head>
<body>
    <h1>CSS 'display' Basics</h1>

    <h2>1&rpar; display: block</h2>
    <div id="block">I am ablock level box</div>
    <div id="block">I start on a new line and stretch full width</div>
    
    <h2>2&rpar; display: inline</h2>
    <div id="inline">I am inline</div>
    <div id="inline">so i flow side lorem item</div>
    <div id="inline">Lorem ipsum dolor sit.</div>

    <h2>3&rpar; display: inline-block</h2>
    <div id="inline-block">Box A</div>
    <div id="inline-block">Box B</div>
    <div id="inline-block">box C</div>

</body>
</html>

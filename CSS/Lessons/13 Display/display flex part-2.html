<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Arribute</title>

    <style>
        span {
            font-size: 18px;
        }

        #container-one {
            background: rgb(194, 188, 188);
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 10px 5px 10px;
            gap: 1rem;
        }

        #container-two {
            background: rgb(194, 188, 188);
            display: inline-flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 10px 5px 10px;
            gap: 1rem;
        }

        .item1 {
            padding: 10px;
            border-radius: 5px;
            background-color: rgb(181, 129, 230);
            flex:1 1 calc(33% - 3rem);
            text-align: center;
        }
        hr {
            margin-top: 20px;
            margin-bottom: 20px;
            border: 1px solid black;
        }
        .item2 {
            padding: 10px;
            border-radius: 5px;
            background-color: rgb(230, 129, 196);
            flex:1 1 calc(50% - 2rem);
            text-align: center;
        }

    </style>
</head>
<body>
    <h1>CSS <span>display: flex</span> Demo</h1>

    <section id="container-one">
        <div class="item1">item1</div>
        <div class="item1">item2</div>
        <div class="item1">item3</div>
        <div class="item1">item4</div>
        <div class="item1">item5</div>
        <div class="item1">item6</div>
        <div class="item1">item7</div>
    </section>

    <hr>
    <h1>CSS <span>display: inline-flex</span> Demo</h1>

    <section id="container-two">
        <div class="item2">item1</div>
        <div class="item2">item2</div>
        <div class="item2">item3</div>
        <div class="item2">item4</div>
        <div class="item2">item5</div>
        <div class="item2">item6</div>
        <div class="item2">item7</div>
    </section>

    <hr>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #nav {
            display: flex;
            padding-left: 0px;
            background-color: aquamarine;
            border-radius: 5px;
            text-align: center;
        }

        li {
            padding: 5px 15px 5px;
            list-style: none;
        }

        li:hover {
            background-color: black;
            color: white;
            border-radius: 5px;
        }

        #none, #visible {
            display: inline-block;
            width: 150px;
            height: 25px;
            background-color: rgb(0, 14, 139);
            border-radius: 5px;
            border: none;
            color: white;
        }

        #none:hover {
            display: none;
        }

        #visible:hover {
            visibility: hidden;;
        }
    </style>
</head>
<body>
    <nav>
        <ul id="nav">
            <li>Main</li>
            <li>Profile</li>
            <li>Products</li>
            <li>Certificates</li>
            <li>Connects</li>
        </ul>
        <hr><br>
        <button id="visible">Hide by visible</button>
        <button id="none">Hide by none</button>
        <br><br><hr><br>
        <button id="none">Hide by none</button>
        <button id="visible">Hide by visible</button>
    </nav>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
    <style>
    * { text-align: center; box-sizing: border-box; margin:0; padding:0; }
    body { font-family: sans-serif; padding: 2rem; }

        .container {
            margin: auto;
            position: relative;
            border: 1px solid black;
            width: 250px; height: 250px;
            border-radius: 10px;
        }
        .card {
            border-radius: 10px;
            position: absolute;
            width: 100px; height: 100px;
            opacity: 0.9;
            display: flex; align-items: center; justify-content: center;
        }

        .card1 {
            top: 20px; left: 130px;
            z-index: 1;
            background-color: rgb(81, 255, 0);
            
        }
        .card2 {
            top: 30px; left: 70px;
            z-index: 2;
            background-color: rgb(255, 0, 157);
        }
        .card3 {
            top: 90px; left: 140px;
            z-index: 3;
            background-color: rgb(255, 0, 0);
        }
        .card4 {
            top: 120px; left: 50px;
            z-index: 4;
            background-color: rgb(0, 255, 255);
        }
    </style>
</head>
<body>
    <h1>Z-index Stacking Demo</h1>
    <div class="container">
        <div class="card card1">z-index: 1;</div>
        <div class="card card2">z-index: 2;</div>
        <div class="card card3">z-index: 3;</div>
        <div class="card card4">z-index: 4;</div>
    </div>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sapiente.</p>
</body>
</html>

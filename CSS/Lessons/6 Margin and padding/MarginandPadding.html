<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin and padding</title>

    <style>

        div {
            margin: 15px 10px 20px;
            padding: 10px;
            background-color: lightblue;
            border-radius: 10px;
        }

        div > p {
            padding: 5px;
            /* margin collapse */
            /* display: inline-block; */
            background-color: lightyellow;
            border-radius: 5px;
        }



    </style>
</head>
<body>
    <div>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eveniet sequi dolorem tempora!</p>

        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Alias!</p>
    </div>
</body>
</html>

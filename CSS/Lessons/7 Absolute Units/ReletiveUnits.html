<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reletive Units</title>

    <style>
        #container {
            display : flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            background-color: lightblue;
        }

        #box1 {
            width: 200px;
            height: 110px;
            margin: 10px;
            padding: 10px;
            border: 2px solid black;
            text-align: center;
            border-radius: 10px;
        }

        #box2 {
            width: 2in;
            height: 1.1in;
            margin: 10px;
            padding: 10px;
            border: 2px solid black;
            text-align: center;
            border-radius: 10px;
        }

        #box3 {
            width: 5cm;
            height: 2.9cm;
            margin: 10px;
            padding: 10px;
            border: 2px solid black;
            text-align: center;
            border-radius: 10px;
        }

        #box4 {
            width: 140pt;
            height: 80.5pt;
            margin: 10px;
            padding: 10px;
            border: 2px solid black;
            text-align: center;
            border-radius: 10px;
        }

    </style>

</head>
<body>
    <div  id="container">
        
        <div id="box1">
            <p>width: 200px; <br> height: 110px;</p>
        </div>

        <div id="box2">
            <p>width: 2in; <br> height: 1.1in;</p>
        </div>

        <div id="box3">
            <p>width: 5cm; <br> height: 2.9cm;</p>
        </div>

        <div id="box4">
            <p>width: 140pt;<br>height: 80.5pt;</p>
        </div>
    </div>
</body>
</html>

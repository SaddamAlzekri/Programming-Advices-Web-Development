<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box sizing</title>

    <style>
        body {

        }

        h1 {
            text-align: center;
        }
        #box1 {
            box-sizing: content-box;
            width: 220px;
            height: 120px;
            padding: 20px;
            border: 5px solid blue;
            background-color: darkseagreen;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #box2 {
            box-sizing: border-box;
            width: 220px;
            height: 120px;
            padding: 20px;
            border: 5px solid blue;
            background-color: rgb(155, 143, 188);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>
<body>
    <h1>Box-sizing</h1>  

    <h2>1&rpar; box-sizing: content-box (defualt)</h2>
    <div id="box1">
        box-sizing: content-box;(defualt) <br>
        width: 220px;<br>
        height: 120px;<br>
        padding: 20px;<br>
         border: 5px;<br>
         Total content : 220px;
    </div>

    <br>
    <h2>2&rpar; box-sizing: border-box</h2>
    <div id="box2">
        box-sizing: border-box; <br>
        width: 220px;<br>
        height: 120px;<br>
        padding: 20px;<br>
        border: 5px;<br>
        Total content : 170px;
    </div>
</body>
</html>

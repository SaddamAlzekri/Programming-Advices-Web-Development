<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float and clear</title>

    <style>
        .tooltip {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .tooltip .tooltip-text{
            visibility: hidden;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translate(-50);
            white-space: nowrap;
            background-color: black;
            color: white;
            padding: 5px;
            border-radius: 5px;
            opacity: 0.7;
        }
        .tooltip:hover .tooltip-text{
            visibility: visible;
            opacity: 1;
        }

 .tooltip .tooltip-text::after {
    content: "";
    position: absolute;
    top: 100%;      /* arrow at bottom of tooltip box */
    left: 50%;
    transform: translateX(-50%);
    border-width: 6px;
    border-style: solid;
    border-color: #0a0a0a transparent transparent transparent;
    }
    </style>
</head>
<body style="font-size: 20px;">
    <br><br><br>
      <p class="tooltip">The enternet is www
        <spa class="tooltip-text">World wide web</span>
      </p>
</body>
</html>

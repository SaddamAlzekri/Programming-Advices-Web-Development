<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-Elements</title>
    <style>
        .btnSearch::before {
            content: "🔍 ";
        }

        .btnSearch {
            font-weight: bold;
            width: 150px;
            height: 40px;
            background-color: rgb(0, 174, 255);
            border: none;
            border-radius: 10px;
            color: white;
        }

        blockquote {
            padding: 15px;
            border-left: 3px solid black;
            background-color: white;
        }

        blockquote::before
        {            
            content: "🔍 ";
        }

        .card {
            position: relative;
            width: 200px;
            height: 100px;
            padding: 20px;
            margin: 20px 0px 20px;
            border: 1px solid black;
            border-radius: 4px;
            background-color: white;
            font-size: 15px;
            font-weight: bold;
        }

        .card::before {
            content: "New";
            position: absolute;
            top: 0; right: 0;
            background: #e74c3c;
            color: #fff;
            border-radius: 4px;
            font-size: 15px;
            padding: 5px;
    }

    </style>
</head>
<body style="background-color: rgb(207, 202, 202);">
    <h1>CSS Pseudo-Elements ::before & ::after</h1>

    <button class="btnSearch">Search</button>

    <blockquote>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Accusamus.</blockquote>

    <div class="card">
        <h1>Product Name</h1>
        <p>$19.99</p>
    </div>
</body>
</html>

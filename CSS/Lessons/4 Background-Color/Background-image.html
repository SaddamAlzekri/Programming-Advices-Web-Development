<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Image</title>
    <style>
        body {
            background-image: url(Wood-Image.png);
            background-repeat: repeat;
            background-size: cover;
            background-position: center;
        }

        div {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
        }
        p {
            font-size: 20px;
        }

        button {
            font-size: 30px;
            border-radius: 30px;
            border: none;
            margin-top: 250px;
            margin-left: 20px;
            width: 150px;
            height: 75px;
            color: black;
            background-color:  rgba(255, 255, 255, 0.4);
        }

        button:hover {
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
        }
    </style>
</head>
<body>
    <div>
        <h1>Wellcom to CSS Background image!</h1>

        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Omnis modi voluptate vitae corporis error doloribus voluptatum incidunt aperiam dolore sit.</p>
    </div>

    <button type="submit">Submit</button>
</body>
</html>

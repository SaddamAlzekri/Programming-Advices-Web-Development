<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>print style</title>

    <style>
        nav {
            padding: 10px;
            background-color: rgba(0, 0, 0, 1);
            color: white;
            border-radius: 5px;
        }
        .no-print {
            color: red;
        }

        @media print {
            .nav, .no-print {
                display: none;
            }
        }
    </style>

</head>
<body>
    <nav class="nav">Mian Navigation</nav>
    <h1>Article Title</h1>
    <p>This paragraph will print in black text at 12pt size.</p>
    <p class="no-print">This line is marked “no-print” and won’t appear on paper.</p>

</body>
</html>

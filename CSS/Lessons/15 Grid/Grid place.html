<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>place items</title>
    <style>
        #container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
        }

        .item {
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
        }

        .item1x {
            background-color: yellow;
            color: black;
            grid-column: 3 /4;
            grid-row: 1/2;
        }

        hr {
            margin: 20px 0px 20px;
            border: 1px solid black;
        }

        .item2x {
            background-color: yellow;
            color: black;
            grid-column: 2 /3;
            grid-row: 2/3;
        }

        .item3x {
            background-color: yellow;
            color: black;
            grid-column: 1 /3;
            grid-row: 2/4;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item4x {
            background-color: yellow;
            color: black;
            grid-column: 1 /4;
            grid-row: 1/2;
        }

        .item5x {
            background-color: yellow;
            color: black;
            grid-column: 2 /3;
            grid-row: 2/4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>
<body>
    <h1> place items</h1>

    <section id="container">
        <div class="item item1x">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
        <div class="item">item5</div>
        <div class="item">item6</div>
    </section>

    <hr>

    <section id="container">
        <div class="item item2x">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
        <div class="item">item5</div>
        <div class="item">item6</div>
    </section>

    <hr>

    <section id="container">
        <div class="item item3x">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
        <div class="item">item5</div>
        <div class="item">item6</div>
    </section>

    <hr>

    <section id="container">
        <div class="item item4x">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
        <div class="item">item5</div>
        <div class="item item5x">item6</div>
    </section>
    
</body>
</html>

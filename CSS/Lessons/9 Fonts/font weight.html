<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font weight</title>

    <style>
        h1 {
            text-align: center;
        }

        #normal {
            font-weight: normal;
        }

        #bold {
            font-weight: bold;
        }
        #bolder {
            font-weight: bolder;
        }
        #lighter {
            font-weight: lighter;
        }
        #bynum1 {
            font-weight: 100;
        }
        #bynum2 {
            font-weight: 300;
        }
        #bynum3 {
            font-weight: 900;
        }
    </style>
</head>
<body>
    <h1>font weight</h1>
    <p id="normal">this is text is normal</p>
    <p id="bold">this is text is bold</p>
    <p id="bolder">this is text is bolder</p>
    <p id="lighter">this is text is lighter</p>
    <p id="bynum1">this is text is 100</p>
    <p id="bynum2">this is text is 300</p>
    <p id="bynum3">this is text is 900</p>
</body>
</html>

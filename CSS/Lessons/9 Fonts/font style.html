<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font style</title>
    <style>
        body > #text1 {
            font-size: 20px;
        }

        h1 {
            text-align: center;
            font-style: normal;
        }


        #text1 {
            font-style: italic;
        }

        #text2 {
            font-style: oblique;
        }

        #text3 {
            font-family: Arial, Helvetica, sans-serif;
            font-style: oblique 30deg;
        }
    </style>
    
</head>
<body>
    <h1>This is normal text</h1>
    <p id="text1">This is <strong>italic</strong> text</p>
    <p id="text2">This is <strong>oblique</strong> text</p>
    <p id="text3">This is <strong>oblique deg</strong> text</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font family</title>

    <style>
        body {
            font-size: 30px;
        }

        h1 {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        #paragraph-1 {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        
        #paragraph-2 {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        #paragraph-3 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #paragraph-4 {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }


    </style>
</head>
<body>

    <h1>font family</h1>
    <p id="paragraph-1">Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif</p>
    <p id="paragraph-2">Verdana, Geneva, Tahoma, sans-serif</p>
    <p id="paragraph-3">'Segoe UI', Tahoma, Geneva, Verdana, sans-serif</p>
    <p id="paragraph-4">Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font size</title>
    <style>
        h1 {
            text-align: center;
            font-size: xx-large;
        }

        #smaller {
            font-size: smaller;
        }

        #xx-small {
            font-size: xx-small;
        }

        #x-small {
            font-size: x-small;
        }

        #small {
            font-size: small;
        }
        
        #medium {
            font-size: medium;
        }
        
        #xx-larg {
            font-size: xx-large;
        }
                
        #x-larg {
            font-size: x-large;
        }
                
        #larg {
            font-size: large;
        }

        #largger {
            font-size: largger;
        }


    </style>
</head>
<body>
    <h1>font size</h1>
    <p id="xx-small">xx-small</p>
    <p id="x-small">x-small</p>
    <p id="small">small</p>
    <p id="smaller">smaller</p>
    
    <p id="medium">medium</p>
    
    <p id="largger">largger</p>
    <p id="larg">larg</p>
    <p id="x-larg">x-larg</p>
    <p id="xx-larg">xx-larg</p>

</body>
</html>

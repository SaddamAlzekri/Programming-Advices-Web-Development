<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centering elements</title>
    <style>
        * {
            font-size: 18px;
            margin: 0 auto;
            font-family: 'Times New Roman', Times, serif;
        }
        body {
            background-color: rgb(245, 243, 243);
        }
        section {
            margin-top: 1rem;
        }
        .img1 {
            width: 300px;
            height: 150px;
            display: block;
            margin: auto;
            border-radius: 30px;
        }
        h1, h2 {
            text-align: center;
        }
        .img2 {
            width: 300px;
            height: 150px;
            display: flex;
            align-items: center;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <h1>Centrting of elements</h1>

    <section>
        <h2 style="margin-bottom: 0.5rem;">centering by <code>margin: 0 auto</code></h2>
        <div>
            <img class="img1" src="26 filters/Examples/Images/A1.jpg" alt="centering by margin">
        </div>
    </section>

    <section>
        <h2 style="margin-bottom: 0.5rem;">centering by <code>flex</code></h2>
        <div>
            <img class="img2" src="26 filters/Examples/Images/A1.jpg" alt="centering by margin">
        </div>
    </section>
    
</body>
</html>

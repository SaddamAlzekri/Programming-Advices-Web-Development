<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 30px;
        }
        
        #container {
            padding: 10px;
            width: 100%;
            height: 100px;
            background-color: rgba(0, 0, 0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-radius: 10px;
        }

        #container2 {
            padding: 10px;
            width: 100%;
            background-color: rgba(0, 0, 0,0.5);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-radius: 10px;
        }

        .item {
            padding: 20px;
            width: 50px;
            height: 50px;
            background-color: white;
            color: black;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item2 {
            padding: 20px;
            width: 50px;
            height: 50px;
            background-color: white;
            color: black;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        hr {
            margin: 20px 0px 20px;
            border: 1px solid black;
        }

        .item1x {
            align-self: flex-start;
            background-color: yellow;
        }
    </style>

</head>
<body>
    <section id="container">
        <div class="item">item1</div>
        <div class="item">item2</div>
        <div class="item">item3</div>
        <div class="item">item4</div>
        <div class="item item1x">item6</div>
    </section>

    <hr>

        <section id="container2">
        <div class="item2">item1</div>
        <div class="item2">item2</div>
        <div class="item2">item3</div>
        <div class="item2">item4</div>
        <div class="item2">item5</div>
        <div class="item2">item6</div>
        <div class="item2">item7</div>
        <div class="item2">item8</div>
        <div class="item2">item9</div>
        <div class="item2">item10</div>
        <div class="item2">item11</div>
        <div class="item2 item2x">item12</div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button as link</title>
</head>
<body>
    <h1>button as link</h1>

    <p>
        <button onclick="window.location.href = 'https://programmingadvices.com'"> visit programming Advices </button>
    </p>

    <p>
        <button onclick="window.open('https://programmingadvices.com', '_blank')">visit programming Advices</button>
    </p>

    <p>
        <button onclick="window.open('https://programmingadvices.com', 'Programming Advices', 'width:600, hight:600')">visit programming Advices</button>
    </p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="getinfo.html" method="post">
        <fieldset>
            <legend>Person Information</legend>

            <label for="FullName"> Name :</label>
            <input type="text" name="FullName" id="FullName" required placeholder="Enter FullName">
            &nbsp;
            <label for="Age"> Age :</label>
            <input type="text" name="Age" id="Age" min="18" max="65" required title="Age must between 18 and 65">
            <br><br>
            <label for="Email">Email</label>
            <input type="email" name="Email" id="Email" required placeholder="Enter valid email">
            &nbsp;
            <label for="website">URL of website</label>
            <input type="url" name="website" id="website" required pattern="https?://.*" title="include http:// or https://">
            <br><br>
            <label for="password">Password :</label>
            <input type="password" name="password" id="password" minlength="8" required title="Password must be at least 8">
            &nbsp;
            <label for="phone"> Phone :</label>
            <input type="tel" name="phone" id="phone" pattern="[0-9]{10}" required title="Enter a 10-digit phone number">
            <br><br>
            <label for="Date"> Date of Birth :</label>
            <input type="date" name="Date" id="Date" required title="Enter the Birthdate">
            &nbsp;
            <label for="color"> Date of Birth :</label>
            <input type="color" name="color" id="Date" required>
            <br><br>
            <button type="submit">submit</button>
        </fieldset>
    </form>
</body>
</html>

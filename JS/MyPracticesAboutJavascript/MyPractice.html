<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Practice</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: #0b1020;
            color: white;
            margin: 0;
            padding: 24px;
        }
        .app {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 0 12px;
        }
        .muted {
            opacity: 0.75;
        }
        .row {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            align-items: center;
            margin: 0 0 12px;
        }
        button {
            background: #4f7cff;
            color: white;
            font-weight: 600;
            height: 40px;
            padding: 0 10px;
            border: none;
            border-radius: 14px;
            transition: transform 0.5s ease;
        }
        button:hover {
            transform: scale(1.1);
        }
        .input1 {
            background: #0b1020;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            margin: 0 0 12px; 
            padding: 0 7px;
            color: white;
        }
        .input2 {
            width: 250px;
            background: #0b1020;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            margin: 0 0 12px; 
            padding: 0 7px;
            color: white;
        }
        .msg {
            font-size: 24px;
            text-align: center;
            margin: 0 0 12px;
        }
        span {
            color: red;
        }
        .msg {
            background:  rgba(255, 255, 255, 0.18);
            border-radius: 14px;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="card">
            <h2 style="margin: 0 0 12px;">Lorem ipsum dolor sit amet consectetur adipisicing.</h2>
            <p class="muted" style="margin: 0 0 50px;">Lorem ipsum dolor sit amet consectetur adipisicing elit. Amet a debitis numquam, quis nesciunt eligendi!</p>

            <div class="row">
                <div class="column1">
                    <button id="btn">Display</button>
                    <input class="input1" id="enterName" type="text" placeholder="Enter your name...">
                    <div class="msg" id="msg">Hello <span id="hide">???????</span></div>
                </div>

                <div class ="column2">
                    <input class="input2" id="enterNamex" type="text" placeholder="Enter your name...">
                    <div class="msg" id="msgx">Hello <span id="hidex">???????</span></div>
                </div>
            </div>            
        </div>        
    </div>

    <script>
        const btn = document.getElementById("btn");
        const hide = document.getElementById("hide");
        const enterName = document.getElementById("enterName");

        const btnx = document.getElementById("btnx");
        const hidex = document.getElementById("hidex");
        const enterNamex = document.getElementById("enterNamex");

        let isSighn = false;

        btn.addEventListener("click", () => {
            hide.textContent = enterName.value;

            if(hide.textContent === "") {
                hide.textContent = "???????";
            }
        });

        enterNamex.addEventListener("input", () => {
            hidex.textContent = enterNamex.value;

            if(hidex.textContent === "") {
                hidex.textContent = "???????";
            }
        });


    </script>
</body>
</html>

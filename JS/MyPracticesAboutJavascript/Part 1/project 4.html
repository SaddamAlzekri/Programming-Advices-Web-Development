<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background:  #0b1020;
            color: white;
            margin: 0;
            padding: 24px;
        }
        .app {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background:  rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 16px;
        }
        .muted {
            opacity: 0.75;
        }
        button {
            height: 35px;
            border: none;
            padding: 0 5px;
            border-radius: 14px;
            background: #4f7cff;
            color: #fff;
            font-weight: 600;
            transition: transform 0.5s ease;
        }
        button:hover {
            transform: scale(1.1);
        }
        .item {
            padding: 12px;
            margin: 12px 0 0;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="card">
            <h3 style="margin: 0 0 10px;">First Success Wins (Promise.any)</h3>
            <p class="muted" style="margin: 0 0 8px">Simulates multiple servers. We accept the first successful response.</p>

            <button id="btn">Get Data</button>

            <div class="list" id="log""></div>
        </div>
    </div>

    <script>
        const btn= document.getElementById("btn");
        const log= document.getElementById("log");

        function divCreat(text) {
            const div = document.createElement("div");
            div.className = "item muted";
            div.textContent = text;
            log.append(div);
        }

        async function someServer(serverName, deleyMs, isRun) {
            return new Promise ((resolve, reject) => {

                setTimeout(() => {
                    if(isRun) throw new Error("Error");
                    else {
                        resolve({
                            server: serverName,
                            timeMs: deleyMs,
                            run : isRun,
                        });
                    }
                });
            }, deleyMs);
        }

        btn.addEventListener("click",async () => {
            btn.disabled = true;

            divCreat("Trying multiple servers…");

            const servers = [
                someServer("server A", 700, true),
                someServer("server B", 800, true),
                someServer("server C", 900, false),
            ];

            try {
                const winner = await Promise.any(servers);
                divCreat(`Winner: ${winner.server} in ${winner.deleyMs}ms → ${winner.run}`);
            }catch(err) {

            }finally {

            }
        });


    </script>
</body>
</html>

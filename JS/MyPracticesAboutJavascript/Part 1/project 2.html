<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: system-ui;
            margin: 0;
            padding: 24px;
            background: #0b1020;
            color: #e9eefc;;
        }
        .app {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid  rgba(255, 255, 255, 0.12);
            margin: 0;
            padding: 16px;
            border-radius: 14px;
        }
        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin: 0 0 12px;
        }
        .status {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin: 0 0 12px;
        }
        button.btnload {
            font-weight: 600;
            height: 40px;
            background: #4f7cff;
            color: white;
            cursor: pointer;
            border-radius: 12px;
            border: 0;
            padding: 10px 14px;

        }
        button.pill {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 12px;
        color: white;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid  rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .muted {
            opacity: 0.9;
        }
        .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
    </style>
</head>
<body>
    <div class="app">
        <div class="card">
            <h2 style="margin: 0 0 12px;">Parallel Fetch Dashboard</h2>
            <p class="muted" style="margin: 0 0 12px;">Loads users + posts at the same time and shows quick stats.</p>


            <div class="row" id="row">
                <button class="btnload" id="btnLoad">Load Dashboard</button>
                <button class="pill" id="btnStatus">Idle</button>
            </div>

            <div class="status" id="status" style="display: none;">
                <div class="spinner"></div>
                <div>Loading...</div>
            </div>
        
            <div class="grid" id="grid"></div>
            <div class="muted" id="error"></div>
        </div>
    </div>

    <script>

        const UI = {
            btnloadDashboard: document.getElementById("btnLoad"),
            btnStatus: document.getElementById("btnStatus"),
            status: document.getElementById("status"),
            grid: document.getElementById("grid"),
            error: document.getElementById("error"),
        };

        function setStatus(message) {
            UI.btnStatus.textContent = message;
        }

        function renderUser(title, value, note = "") {
            return `
                <div class="stat" style = "background: rgba(0, 0, 0, 0.18); padding: 14px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08);">
                    <div class="muted">${title}</div>
                    <div style="font-size:28px;font-weight:800;margin-top:6px;">${value}</div>
                    <div class="muted" style="margin-top:6px;">${note}</div>
                </div>`
        }

        async function loadDashboard() {

            UI.btnloadDashboard.disabled = true;
            UI.status.style.display = "flex";

            setStatus("loading...");
            try {
                const [usersRes, postsRes] = await Promise.all([
                    fetch("https://jsonplaceholder.typicode.com/users"),
                    fetch("https://jsonplaceholder.typicode.com/posts"),
                ]);
                if(!usersRes.ok || !postsRes.ok)
                    throw new error("One of the requests failed.");
                
                const [users, posts] = await Promise.all([
                    usersRes.json(),
                    postsRes.json(),
                ]);

                const postsPerUser = Math.round(posts.length / users.length);

                UI.grid.innerHTML = [
                    renderUser("Users", users.length.toLocaleString(), "Fetched from API"),
                    renderUser("Posts", posts.length.toLocaleString(), "Fetched from API"),
                    renderUser("Avg posts/user", postsPerUser.toLocaleString(), "Computed locally"),
                    ].join("");

                setStatus("✅ Ready");


            }catch(e) {
                setStatus("❌ Error");
                UI.error.textContent = `❌ Failed: ${e.message}`;
                UI.btnloadDashboard.disabled = false;
            }finally{
                UI.status.style.display = "none";
                UI.btnloadDashboard.disabled = false;
            }
        }

        UI.btnloadDashboard.addEventListener("click", loadDashboard);


    </script>
</body>
</html>

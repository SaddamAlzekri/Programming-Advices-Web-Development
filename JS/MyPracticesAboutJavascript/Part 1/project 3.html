<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background:  #0b1020;
            color: white;
            margin: 0;
            padding: 24px;
        }
        .app {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background:  rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 16px;
        }
        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            height: 40px;
            border: none;
            padding: 0 10px;
            border-radius: 14px;
            background: #4f7cff;
            color: #fff;
            font-weight: 600;
            transition: transform 0.5s ease;
        }
        button:hover {
            transform: scale(1.1);
        }
        input {
            border: 1px solid #e9eefc;
            background: #0b1020;
            color: white;
            height: 40px;
            border-radius: 14px;
            padding: 0 10px;
            font-size: 40;
            font-weight: 600;
        }
        pre {
            white-space: pre-wrap;
            background: #0b1020;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
        }



    </style>
</head>
<body>
    <div class="app">
        <div class="card">
            <h2 style="margin: 0 0 10px;">Timeout Fetch (Promise.race)</h2>
            <p style="margin: 0 0 8px">Fetches a post. If it takes too long, we timeout.</p>

            <div class="row" id="row">
                <button id="btn">Fetch Post</button>
                <label for="" class="muted">Timeout (ms)</label>
                <input id="ms" type="number" value="600" step="50" min="50" style="width: 120px;">
            </div>

            <pre id="out" class="muted">Click “Fetch Post”.</pre>
        </div>
    </div>

    <script>
        const btn = document.getElementById("btn");
        const msInput = document.getElementById("ms");
        const out = document.getElementById("out");

        async function timeout(ms) {
            return new Promise( (_,reject) => {
                setTimeout(() => {
                    reject(new Error(`Timed out after ${ms}ms`))
                }, ms);
            })
        }

        async function Koko(url, ms) {
            const res = await Promise.race([fetch(url), ms]);

            if(!res.ok) throw new Error("Server responded with error.");

            return res.json();
        }

        btn.addEventListener("click", async () => {

            btn.disabled = true;
            try {

                const ms = Number(msInput.value);
                const data = await Koko("https://jsonplaceholder.typicode.com/posts/1", timeout(ms));
                out.textContent = JSON.stringify(data, null, 2);    

            }catch(e) {

                out.textContent = `❌ ${e.message}`;
            }finally {
                btn.disabled = false;
            }

        });

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            place-items: center;
            background: linear-gradient(135deg, #1f2933, #0b7285);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
        }
        .card {
            background: #111827;
            padding: 0px 40px 20px;
            border-radius: 10px;
            width: 420px;
            border: 1px solid gray;
        }
        h1 {
            text-align: center;
        }
        #log-title, #log {
            text-align: center;
            margin: 10px 0px;
        }
        #log {
            background: #020617;
            border-radius: 5px;
            border: 1px solid rgba(148, 163, 184, 0.4);
        }
        .subtitle {
            text-align: center;
            margin: 0 0 20px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            height: 35px;
            border-radius: 5px;
            border: none;
            color: white;
            background: #2563eb;
            transition: background 0.2s ease, transform 0.1s ease,
            box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
        }
        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.5);
      }
      .log-line {
        margin: 2px 0;
      }

      .log-ok {
        color: #22c55e;
      }

      .log-error {
        color: #f97373;
      }

      .log-info {
        color: #e5e7eb;
      }
    </style>
</head>
<body>
    <DIV class="card">
        <h1>IndexedDB Simple Example</h1>
        <div class="subtitle">
            Add, read, update, and delete a user with <strong>id = 1</strong>
        </div>
        <div class="btn-group">
            <button onclick="AddUser()"><strong>Add User</strong></button>
            <button onclick="ReadUser()"><strong>Read User</strong></button>
            <button onclick="UpdateUser()"><strong>Update User</strong></button>
            <button onclick="deleteUser()"><strong>Delete User</strong></button>
        </div>
        
      <div id="log-title">Log:</div>
      <div id="log"></div>
    </DIV>

    <script>
        
        function logMessage(message, key = "info") {
            const logBox = document.getElementById("log");

            const line = document.createElement("div");
            line.classList.add("log-line");

            if(key === "ok") line.classList.add("log-ok");
            else if(key === "error") line.classList.add("log-error");
            else line.classList.add("log-info");

            line.textContent = message;
            logBox.appendChild(line);

            logBox.scrollTop = logBox.scrollHeight;

            console.log(message);
        }

        let db;

        const request = indexedDB.open("users", 1);

        request.onupgradeneeded = function (e) {
            db = e.target.result;

            db.createObjectStore("users", {keyPath:"id"});

            logMessage("Object store 'users' created.", "ok");
        }

        request.onsuccess = function(e) {
            db = e.target.result;
            logMessage("✅ Database opened successfully.", "ok");
        }

        request.onerror = function(e) {
            logMessage("❌ Error opening DB: " + e.target.error, "error");
        }

        function AddUser() {
            let tx = db.transaction("users", "readwrite")
            let store = tx.objectStore("users")

            let check = store.get(1);

            check.onsuccess = () => {
                if(check.result !== undefined)
                {
                    logMessage("❌ Cannot add. User with ID=1 already exists.",
                    "error");
                    alert("User already exists!");
                }else {
                    store.add({ id: 1, name: "Ali", age: 20 });

                    tx.oncomplete = () => {
                        logMessage("✅ User with ID=1 added.", "ok");
                        alert("User added!");
                    };
                }
            };
            check.onerror = () => {
                logMessage("❌ Error checking existing user before add.", 
                "error");
            };
        }

        function ReadUser() {
            let tx = db.transaction("users", "readonly");
            let store = tx.objectStore("users");

            let request = store.get(1);

            request.onsuccess = () => {
                if(request.result === undefined) {
                    logMessage("❌ User with ID=1 not found!", "error");
                    alert("User not found in database!");
                }else {
                    logMessage("📖 User found → Name: " + request.result.name +
                    ", Age: " +
                    request.result.age,
                    "ok");
                    alert("User found: " + request.result.name);
                }
            };
            request.onerror = () => {
                logMessage("❌ Error reading user.", "error");
                alert("Something went wrong while reading!");
            };
        }


        function UpdateUser() {
            let tx = db.transaction("users", "readwrite");
            let store = tx.objectStore("users");

            let check = store.get(1);

            check.onsuccess = () => {
                if(check.result === undefined) {
                    logMessage("❌ Cannot update. User with ID=1 does NOT exist.","error");
                    alert("User not found! Cannot update.");
                    return;
                }
                let updatedUser = { id: 1, name: "Koko", age: 30 };
                store.put(updatedUser);

                logMessage("✏️ Updating user with ID=1...", "info");

                tx.oncomplete = () => {
                logMessage("✅ Transaction complete: User updated to " + updatedUser.name + ", age " + updatedUser.age,"ok");
                alert("User updated!");
            };
        };
        check.onerror = () => {
          logMessage("❌ Error reading the user before update.", "error");
        };
        }

        function deleteUser() {
        let tx = db.transaction("users", "readwrite");
        let store = tx.objectStore("users");

        let check = store.get(1);

        check.onsuccess = () => {
            
            if (check.result === undefined) {
            logMessage(
              "❌ Cannot delete. User with ID=1 does NOT exist.",
              "error"
            );
            alert("User not found! Nothing to delete.");
            return;
           }

            store.delete(1);
            
            logMessage("🗑️ Deleting user with ID=1...", "info");

            tx.oncomplete = () => {
                logMessage("✅ Transaction complete: User deleted.", "ok");
                alert("User deleted successfully!");
            };
        };

        request.onerror = () => {
            logMessage("❌ Error checking user before deletion.", "error");
            alert("Error reading user before deletion.");
        }
      }

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #x {

            width: 100px; height: 100px;
        }
        #output {

            width: 100vw; height: 100vh;
        }
    </style>
</head>
<body>
    <button id="x" onclick="scrol300()">click</button>
    <div id="output"> Current Scroll X = 0, Y = 0</div>

    <script>
        function scrol300() {
            window.scrollBy ({top: 400, behavior:"smooth"});
        }

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hellow, World</h1>

    <script>
        let age = prompt("Enter the your age please?");
        if(age == null)
            alert("You canceled the input");
        else if(age === "")
            alert("You didn't enter any content.");
        else
            alert(`you are ${age} years.`);
    </script>

</body>
</html>

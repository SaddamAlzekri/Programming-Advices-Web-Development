<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button type="button" onclick="showMyWindow();">Click</button>
    <script>
        function showMyWindow()
        {
            let myWin = window.open("","myJavaScriptPage", "width=500, height=500, top=200, left=600");
            myWin.document.write("<h1> Hellow, World in inner page<h1>");
            myWin.document.body.style.backgroundColor = "black";
            myWin.document.body.style.color = "white";

            setTimeout(()=> {myWin.close()},5000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.rtl.min.css">
</head>
<body>
    <div class="container mt-4">

    <!-- مثال 1: توسيط العناصر أفقياً -->
    <h3 class="mb-3 text-center">1. التوسيط الأفقي (Center)</h3>
    <div class="d-flex justify-content-center bg-light p-3 mb-4 border" style="height: 100px;">
        <div class="bg-primary text-white p-2 m-1">عنصر 1</div>
        <div class="bg-success text-white p-2 m-1">عنصر 2</div>
        <div class="bg-danger text-white p-2 m-1">عنصر 3</div>
    </div>

    <!-- مثال 2: توزيع العناصر بحيث يكون هناك مسافة بينهم (Space Between) -->
    <h3 class="mb-3 text-center">2. توزيع متساوي (Between)</h3>
    <div class="d-flex justify-content-between bg-light p-3 mb-4 border">
        <div class="bg-warning p-2">اليسار / البداية</div>
        <div class="bg-info p-2">المنتصف</div>
        <div class="bg-dark text-white p-2">اليمين / النهاية</div>
    </div>

    <!-- مثال 3: المحاذاة العمودية (في منتصف الارتفاع) -->
    <h3 class="mb-3 text-center">3. المحاذاة العمودية (Center Vertical)</h3>
    <div class="d-flex align-items-center justify-content-around bg-secondary text-white p-3" style="height: 150px;">
        <div class="bg-danger p-3">في منتصف الارتفاع تماماً 1</div>
        <div class="bg-success p-3">في منتصف الارتفاع تماماً 2</div>
    </div>

</div>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.rtl.min.css">
</head>
<body>
    <div class="container mt-5">

    <!-- قسم الأزرار الأساسية الملونة -->
    <h3 class="mb-3">1. الأزرار الأساسية الملونة</h3>
    <div class="mb-4">
        <button type="button" class="btn btn-primary">رئيسي (Primary)</button>
        <button type="button" class="btn btn-secondary">ثانوي (Secondary)</button>
        <button type="button" class="btn btn-success">نجاح (Success)</button>
        <button type="button" class="btn btn-danger">خطر/حذف (Danger)</button>
        <button type="button" class="btn btn-warning text-dark">تحذير (Warning)</button>
        <button type="button" class="btn btn-info">معلومات (Info)</button>
    </div>

    <!-- قسم الأزرار ذات الحدود (Outline) والأحجام -->
    <h3 class="mb-3">2. أزرار الحدود والأحجام</h3>
    <div class="mb-4">
        <!-- زر بحواف فقط -->
        <button type="button" class="btn btn-outline-primary">زر حدود أزرق</button>
        <!-- زر كبير -->
        <button type="button" class="btn btn-success btn-lg">زر كبير جداً (LG)</button>
        <!-- زر معطل -->
        <button type="button" class="btn btn-dark" disabled>زر معطل (Disabled)</button>
    </div>

    <!-- قسم مجموعات الأزرار (Button Groups) -->
    <h3 class="mb-3">3. مجموعات الأزرار المتلاصقة</h3>
    <div class="btn-group" role="group" aria-label="Basic example">
        <button type="button" class="btn btn-primary">يسار</button>
        <button type="button" class="btn btn-primary">المنتصف</button>
        <button type="button" class="btn btn-primary">يمين</button>
    </div>

</div>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
